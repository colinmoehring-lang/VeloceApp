<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0d12;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #0b0d12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #94a3b8;
      font-size: 13px;
      transition: opacity 0.4s ease;
      padding: 16px;
      text-align: center;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #0099ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .live-marker {
      width: 18px;
      height: 18px;
      border: 3px solid white;
      border-radius: 50%;
      background: #00bfff;
      box-shadow: 0 0 12px 5px rgba(0, 153, 255, .7);
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="loading-overlay">
  <div class="spinner" id="loading-spinner"></div>
  <div id="loading-text">Karte wird geladen...</div>
</div>
<script>
  (() => {
    let map;
    let liveMarker;
    let startMarker;
    let endMarker;
    let lastPosition = null;
    let lastFittedRouteKey = null;
    let pendingUpdate = { route: [], currentPoint: null };
    let pendingAccessToken = null;
    let initAttempts = 0;
    let overlayHidden = false;

    function reportMapError(message) {
      const textElem = document.getElementById('loading-text');
      const spinnerElem = document.getElementById('loading-spinner');
      if (spinnerElem) spinnerElem.style.display = 'none';
      if (textElem) textElem.textContent = message;
      if (window.RideMapBridge) {
        window.RideMapBridge.onMapError(String(message).slice(0, 240));
      }
    }

    function hideLoadingOverlay() {
      if (overlayHidden) return;
      overlayHidden = true;
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);
      }
    }

    function createPointMarkerElement(color, title) {
      const el = document.createElement('div');
      el.style.width = '14px';
      el.style.height = '14px';
      el.style.borderRadius = '50%';
      el.style.border = '2.5px solid white';
      el.style.backgroundColor = color;
      el.style.boxShadow = '0 0 8px rgba(0, 0, 0, 0.6)';
      if (title) el.title = title;
      return el;
    }

    window.addEventListener('error', event => {
      reportMapError(`JavaScript error: ${event.message || 'unknown error'}`);
    });

    window.addEventListener('unhandledrejection', event => {
      reportMapError(`Map request failed: ${event.reason?.message || 'unknown error'}`);
    });

    function validPoint(point) {
      return point &&
        Number.isFinite(point.lat) &&
        Number.isFinite(point.lng) &&
        point.lat >= -90 && point.lat <= 90 &&
        point.lng >= -180 && point.lng <= 180 &&
        (point.lat !== 0 || point.lng !== 0);
    }

    function render(update) {
      if (!map) return;
      if (map.isStyleLoaded()) {
        const coordinates = update.route
          .filter(validPoint)
          .map(point => [point.lng, point.lat]);
        const source = map.getSource('ride-route');
        if (source) {
          source.setData({
            type: 'FeatureCollection',
            features: coordinates.length > 1 ? [{
              type: 'Feature',
              geometry: { type: 'LineString', coordinates },
              properties: {}
            }] : []
          });
        }

        const isLiveMode = validPoint(update.currentPoint);
        const current = isLiveMode ? update.currentPoint : null;

        if (liveMarker) {
          liveMarker.getElement().title = Number.isFinite(update.speedKmh)
            ? `${update.speedKmh.toFixed(1)} km/h`
            : '';
          if (!current) {
            liveMarker.getElement().style.visibility = 'hidden';
          } else {
            const moved = !lastPosition ||
              lastPosition.lat !== current.lat ||
              lastPosition.lng !== current.lng;
            if (moved) {
              liveMarker.setLngLat([current.lng, current.lat]);
              liveMarker.getElement().style.visibility = 'visible';
              map.flyTo({ center: [current.lng, current.lat], duration: 900 });
              lastPosition = { lat: current.lat, lng: current.lng };
            }
          }
        }

        if (!isLiveMode && coordinates.length > 0) {
          const routeKey = coordinates.length + '_' + coordinates[0].join(',') + '_' + coordinates[coordinates.length - 1].join(',');
          if (lastFittedRouteKey !== routeKey) {
            lastFittedRouteKey = routeKey;

            const bounds = new mapboxgl.LngLatBounds();
            coordinates.forEach(c => bounds.extend(c));
            map.fitBounds(bounds, { padding: 45, duration: 800, maxZoom: 16.5 });

            if (!startMarker) {
              startMarker = new mapboxgl.Marker({ element: createPointMarkerElement('#2e7d32', 'Start') }).addTo(map);
            }
            startMarker.setLngLat(coordinates[0]);
            startMarker.getElement().style.visibility = 'visible';

            if (coordinates.length > 1) {
              if (!endMarker) {
                endMarker = new mapboxgl.Marker({ element: createPointMarkerElement('#e58a45', 'Ziel') }).addTo(map);
              }
              endMarker.setLngLat(coordinates[coordinates.length - 1]);
              endMarker.getElement().style.visibility = 'visible';
            } else if (endMarker) {
              endMarker.getElement().style.visibility = 'hidden';
            }
          }
        } else {
          if (startMarker) startMarker.getElement().style.visibility = 'hidden';
          if (endMarker) endMarker.getElement().style.visibility = 'hidden';
        }
      }
    }

    window.updateRideMap = update => {
      pendingUpdate = update;
      if (map) {
        map.resize();
        render(pendingUpdate);
      }
    };

    function createMap(accessToken) {
      mapboxgl.accessToken = accessToken;
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [11.642, 48.138],
        zoom: 16.8,
        pitch: 45,
        bearing: -18,
        trackResize: true,
        preserveDrawingBuffer: true
      });

      map.on('error', event => {
        const status = event.error?.status;
        if (status === 401 || status === 403) {
          reportMapError(
            `Mapbox rejected the token (HTTP ${status}). Check token permissions and URL restrictions.`
          );
        } else {
          reportMapError(
            `Mapbox map error${status ? ` (HTTP ${status})` : ''}: ` +
              (event.error?.message || 'unknown error')
          );
        }
      });

      liveMarker = new mapboxgl.Marker({ element: createMarkerElement() })
        .setLngLat([11.642, 48.138])
        .addTo(map);
      liveMarker.getElement().style.visibility = 'hidden';

      map.on('style.load', () => {
        try {
          map.addSource('ride-route', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          });
          map.addLayer({
            id: 'ride-route-glow',
            type: 'line',
            source: 'ride-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: {
              'line-color': '#0099ff',
              'line-width': 14,
              'line-blur': 8,
              'line-opacity': 0.85
            }
          });
          map.addLayer({
            id: 'ride-route-core',
            type: 'line',
            source: 'ride-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#33c5ff', 'line-width': 7 }
          });
          map.resize();
          render(pendingUpdate);
          if (window.RideMapBridge) window.RideMapBridge.onMapReady();
        } catch (error) {
          reportMapError(`Map style initialization failed: ${error.message || 'unknown error'}`);
        }
      });

      map.on('load', () => {
        map.resize();
        hideLoadingOverlay();
      });

      map.on('idle', () => {
        map.resize();
        hideLoadingOverlay();
      });

      setTimeout(() => {
        if (map && map.isStyleLoaded()) {
          map.resize();
          hideLoadingOverlay();
        }
      }, 3500);

      new ResizeObserver(() => map.resize()).observe(document.getElementById('map'));
      setTimeout(() => map.resize(), 500);
      setTimeout(() => map.resize(), 1500);
    }

    window.initializeMapbox = accessToken => {
      if (map) return;
      pendingAccessToken = accessToken;

      function tryStart() {
        if (map) return;
        if (window.mapboxgl) {
          try {
            createMap(pendingAccessToken);
          } catch (error) {
            reportMapError(`Map initialization failed: ${error.message || 'unknown error'}`);
          }
        } else {
          initAttempts++;
          if (initAttempts < 100) {
            setTimeout(tryStart, 100);
          } else {
            reportMapError('Mapbox GL JS did not load. Check internet connection.');
          }
        }
      }

      tryStart();
    };

    function createMarkerElement() {
      const element = document.createElement('div');
      element.className = 'live-marker';
      return element;
    }
  })();
</script>
</body>
</html>
